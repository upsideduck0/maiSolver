<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>maiSolver — Simai Chart Viewer</title>
    <style>
      :root {
        --bg: #0b0e17;
        --panel: #141a2b;
        --panel-2: #1d2440;
        --text: #e6ebff;
        --muted: #aeb8d4;
        --accent: #36a3ff;
        --accent-2: #ff4f8b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      #stage {
        flex: 1;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
      }
      #playfield { width: 100%; height: 100%; display: block; }
      aside {
        width: 320px;
        background: var(--panel);
        border-left: 1px solid #222b45;
        padding: 18px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      h1 { font-size: 18px; margin: 0; }
      h1 span { color: var(--accent); }
      .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
      .card { background: var(--panel-2); border-radius: 10px; padding: 12px; }
      .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; }
      label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
      input[type="file"] { width: 100%; font-size: 12px; color: var(--muted); }
      select, button {
        font: inherit;
        color: var(--text);
        background: #232c4a;
        border: 1px solid #33406b;
        border-radius: 8px;
        padding: 8px 10px;
        cursor: pointer;
      }
      select { width: 100%; }
      button:hover { background: #2c3760; }
      button.primary { background: var(--accent); border-color: var(--accent); color: #06121f; font-weight: 600; }
      .row { display: flex; gap: 8px; align-items: center; }
      .row > * { flex: 1; }
      .transport { display: flex; gap: 8px; align-items: center; }
      #seek { width: 100%; }
      .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; min-width: 84px; text-align: right; }
      .meta-line { display: flex; justify-content: space-between; gap: 8px; }
      .meta-line span:first-child { color: var(--muted); }
      #warnings { font-size: 11px; color: #ffae3b; max-height: 120px; overflow-y: auto; white-space: pre-wrap; }
      .field { display: flex; flex-direction: column; gap: 4px; }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="playfield"></canvas>
    </div>
    <aside>
      <div>
        <h1>mai<span>Solver</span></h1>
        <div class="sub">Simai chart viewer</div>
      </div>

      <div class="card">
        <h2>Load</h2>
        <div class="field">
          <label for="chart-file">Chart (maidata.txt)</label>
          <input id="chart-file" type="file" accept=".txt,text/plain" />
        </div>
        <div class="field" style="margin-top: 10px;">
          <label for="audio-file">Audio (optional)</label>
          <input id="audio-file" type="file" accept="audio/*" />
        </div>
      </div>

      <div class="card">
        <h2>Chart</h2>
        <div class="field">
          <label for="difficulty">Difficulty</label>
          <select id="difficulty"></select>
        </div>
        <div id="meta" style="margin-top: 10px; display: flex; flex-direction: column; gap: 4px;"></div>
      </div>

      <div class="card">
        <h2>Playback</h2>
        <div class="transport">
          <button id="play" class="primary" style="flex: 0 0 auto;">▶ Play</button>
          <input id="seek" type="range" min="0" max="1000" value="0" />
        </div>
        <div class="time" id="time" style="text-align: left; margin-top: 6px;">0:00.00 / 0:00.00</div>
        <div class="field" style="margin-top: 10px;">
          <label for="speed">Note approach: <span id="speed-val">0.85</span>s</label>
          <input id="speed" type="range" min="0.3" max="2" step="0.05" value="0.85" />
        </div>
      </div>

      <div class="card">
        <h2>Parser warnings</h2>
        <div id="warnings">—</div>
      </div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
